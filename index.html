<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>FIELD · Stage · Etage · F81-UNIT</title>

<style>
body{background:#000;color:#0f0;font-family:monospace;padding:40px;}
pre{background:#111;border-left:3px solid #6cf;padding:12px;}
button{background:#111;color:#0f0;border:1px solid #333;padding:8px 16px;margin-bottom:10px;}
.block{margin-bottom:25px;}
h2{color:#6cf;}
</style>
</head>

<body>

<h1>FIELD · Scientist Verification · F81-UNIT</h1>

<!-- STAGE 1: ID -->
<div class="block">
    <h2>Stage 1 · FIELD-ID</h2>
    <button onclick="verifyID()">ID prüfen</button>
    <pre id="id_out">Bereit…</pre>
</div>

<!-- STAGE 2: Etage · ECO-Feld -->
<div class="block">
    <h2>Stage 2 · Etage · ECO-Feld</h2>
    <button onclick="verifyEco()">ECO-Feld prüfen</button>
    <pre id="eco_out">Bereit…</pre>
</div>

<!-- STAGE 3: Etage · Wirkung -->
<div class="block">
    <h2>Stage 3 · Etage · Wirkung</h2>
    <button onclick="verifyEffect()">Wirkung prüfen</button>
    <pre id="effect_out">Bereit…</pre>
</div>

<script type="module">
import { FIELD } from "./FIELD.js";

// STAGE 1
function verifyID(){
    const out = FIELD.id();
    document.getElementById("id_out").textContent =
        JSON.stringify(out, null, 2);
}

// STAGE 2
function verifyEco(){
    const out = FIELD.eco();
    document.getElementById("eco_out").textContent =
        JSON.stringify(out, null, 2);
}

// STAGE 3
function verifyEffect(){
    const out = FIELD.effect();
    document.getElementById("effect_out").textContent =
        JSON.stringify(out, null, 2);
}
</script>

</body>
</html>
